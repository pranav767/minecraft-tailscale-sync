# Create this file with your actual rclone config:
#   kubectl create secret generic rclone-config \
#     --namespace minecraft \
#     --from-file=rclone.conf=$HOME/.config/rclone/rclone.conf
#
# Or edit this file and replace the placeholder below.
# To base64 encode your rclone.conf:
#   cat ~/.config/rclone/rclone.conf | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: rclone-config
  namespace: minecraft
type: Opaque
data:
  # Replace with: cat ~/.config/rclone/rclone.conf | base64 -w0
  rclone.conf: ""
