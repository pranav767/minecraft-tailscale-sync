# Create this file with your actual Discord webhook URL:
#   kubectl create secret generic discord-webhook \
#     --namespace minecraft \
#     --from-literal=url="https://discord.com/api/webhooks/..."
#
# Or edit this file and replace the placeholder below.
# To base64 encode: echo -n "https://discord.com/api/webhooks/..." | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: discord-webhook
  namespace: minecraft
type: Opaque
data:
  url: ""
