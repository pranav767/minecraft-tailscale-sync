apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: games
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      terminationGracePeriodSeconds: 300

      # Init container: download world from cloud on start
      initContainers:
        - name: sync-pre-start
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache rclone
              echo "=== Downloading world from cloud ==="
              rclone sync "$RCLONE_REMOTE/world" "$MINECRAFT_DIR/world" \
                --checksum --progress --verbose
              echo "=== Download complete ==="
          env:
            - name: MINECRAFT_DIR
              value: /data
            - name: RCLONE_REMOTE
              value: "minecraft-gdrive:minecraft-world-sync"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rclone-config
              mountPath: /root/.config/rclone
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi

      containers:
        # --- Minecraft Server ---
        - name: minecraft
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: MEMORY
              value: "2560M"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "26.2"
            - name: PAPER_BUILD
              value: "55"
          ports:
            - containerPort: 25565
          resources:
            requests:
              memory: "2048Mi"
              cpu: "500m"
            limits:
              memory: "3072Mi"
          volumeMounts:
            - name: data
              mountPath: /data

        # --- Sync Agent (shutdown hook only) ---
        - name: sync-agent
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache rclone curl

              echo "=== Sync agent started ==="

              # Wait for Tailscale (up to 30s)
              echo "Waiting for Tailscale interface..."
              for i in $(seq 1 30); do
                if ip link show tailscale0 2>/dev/null; then
                  echo "Tailscale is up after ${i}s"
                  break
                fi
                sleep 1
              done

              # Get Tailscale IP
              MY_TAILSCALE_IP=$(ip -4 addr show tailscale0 2>/dev/null | grep inet | awk '{print $2}' | cut -d/ -f1 | head -1)
              [ -z "$MY_TAILSCALE_IP" ] && MY_TAILSCALE_IP="unavailable"
              echo "My Tailscale IP: $MY_TAILSCALE_IP"

              # Notify Discord server is up
              curl -s -H "Content-Type: application/json" \
                -X POST "$DISCORD_WEBHOOK_URL" \
                -d "{\"embeds\":[{\"title\":\"🟢 $SERVER_NAME is Online!\",\"description\":\"**$SERVER_NAME** is now live.\\n\\n📡 **Tailscale IP:** \`$MY_TAILSCALE_IP\`\\n🎮 **Connect:** \`$MY_TAILSCALE_IP:$MINECRAFT_PORT\`\\n\\nJoin via the Tailscale IP from your Minecraft client.\",\"color\":65280,\"timestamp\":\"$(date -u +%Y%m%dT%H%M%SZ)\"}]}" > /dev/null

              # Sleep forever — preStop handles shutdown
              sleep infinity
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Wait for Minecraft to finish saving
                    echo "Waiting 15s for Minecraft to save world..."
                    sleep 15

                    # Upload world to cloud (source of truth)
                    echo "=== Uploading world to cloud ==="
                    rclone sync "$MINECRAFT_DIR/world" "$RCLONE_REMOTE/world" \
                      --checksum --progress --verbose || echo "WARNING: rclone sync failed"
                    echo "=== Upload complete ==="

                    # Get Tailscale IP
                    offline_ip="unknown"
                    if ip -4 addr show tailscale0 2>/dev/null; then
                      offline_ip=$(ip -4 addr show tailscale0 2>/dev/null | grep inet | awk '{print $2}' | cut -d/ -f1 | head -1)
                    fi
                    [ -z "$offline_ip" ] && offline_ip="unknown"

                    world_size=$(du -sh "$MINECRAFT_DIR/world" 2>/dev/null | cut -f1)
                    [ -z "$world_size" ] && world_size="unknown"

                    # Notify Discord
                    curl -s -H "Content-Type: application/json" \
                      -X POST "$DISCORD_WEBHOOK_URL" \
                      -d "{\"embeds\":[{\"title\":\"🔴 $SERVER_NAME is Offline\",\"description\":\"**$SERVER_NAME** has shut down.\\n📡 **Was at:** \`$offline_ip\`\\n💾 **World size:** $world_size\\n☁️ **World uploaded** to cloud\\n\\nThe other server can now be started safely.\",\"color\":16711680,\"timestamp\":\"$(date -u +%Y%m%dT%H%M%SZ)\"}]}" > /dev/null || echo "WARNING: Discord notification failed"
                    echo "=== Server offline notification sent ==="
          env:
            - name: SERVER_NAME
              value: "server-jinx"
            - name: MINECRAFT_DIR
              value: /data
            - name: MINECRAFT_PORT
              value: "25565"
            - name: RCLONE_REMOTE
              value: "minecraft-gdrive:minecraft-world-sync"
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rclone-config
              mountPath: /root/.config/rclone
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        # --- Tailscale Sidecar ---
        - name: tailscale
          image: tailscale/tailscale:latest
          command:
            - /bin/sh
            - -c
            - |
              # Start tailscale, then set up serve proxy for Minecraft
              /usr/local/bin/containerboot &
              # Wait for tailscale to be up
              for i in $(seq 1 60); do
                if tailscale status &>/dev/null; then
                  break
                fi
                sleep 1
              done
              sleep 5
              # Proxy inbound Tailscale traffic to Minecraft port
              echo "Setting up tailscale serve for Minecraft..."
              tailscale serve --bg tcp:25565 || echo "serve setup failed (may already be set)"
              tailscale serve status || true
              wait
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: "minecraft-server"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "true"
          securityContext:
            privileged: true
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: tailscale-state
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: rclone-config
          secret:
            secretName: rclone-config
            items:
              - key: rclone.conf
                path: rclone.conf
